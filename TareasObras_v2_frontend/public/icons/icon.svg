<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle / Rounded Box -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Ring / Clock Frame -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primary)" stroke-width="24" stroke-dasharray="14 10" opacity="0.85"/>
  
  <!-- Construction Helmet Icon -->
  <path d="M170 290 C170 190, 342 190, 342 290 Z" fill="url(#accent)"/>
  <rect x="140" y="285" width="232" height="24" rx="12" fill="url(#accent)"/>
  <rect x="244" y="180" width="24" height="85" rx="8" fill="#fbbf24"/>

  <!-- Clock Hands -->
  <circle cx="256" cy="380" r="12" fill="#60a5fa"/>
  <line x1="256" y1="380" x2="256" y2="340" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="380" x2="285" y2="380" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
</svg>
