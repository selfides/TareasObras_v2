<p-dialog
  [(visible)]="visible"
  [header]="obraId() ? 'Editar Obra' : 'Nueva Obra'"
  [modal]="true"
  appendTo="body"
  [style]="{ width: 'min(640px, 95vw)' }"
  [draggable]="false"
  [closeOnEscape]="true"
  (keydown.escape)="visible.set(false)"
  (onHide)="onHide()"
  class="p-fluid"
>
  @if (loadingData()) {
    <div class="space-y-4 pt-2">
      <p-skeleton height="40px" />
      <div class="grid grid-cols-2 gap-4">
        <p-skeleton height="40px" />
        <p-skeleton height="40px" />
      </div>
      <p-skeleton height="80px" />
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 pt-2">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Código -->
        @if (!obraId()) {
          <div>
            <label class="label-form">Código *</label>
            <input
              pInputText
              formControlName="codigo"
              placeholder="Ej: OBR-001"
              class="w-full"
            />
            @if (invalid("codigo")) {
              <p class="error-msg">Código obligatorio (máx. 20 car.)</p>
            }
          </div>
        }

        <!-- Nombre -->
        <div [class.sm:col-span-2]="!!obraId()">
          <label class="label-form">Nombre *</label>
          <input
            pInputText
            formControlName="nombre"
            placeholder="Nombre de la obra"
            class="w-full"
          />
          @if (invalid("nombre")) {
            <p class="error-msg">Nombre obligatorio</p>
          }
        </div>
      </div>

      <!-- Descripción -->
      <div>
        <label class="label-form">Descripción</label>
        <textarea
          pTextarea
          formControlName="descripcion"
          rows="2"
          class="w-full"
          placeholder="Descripción opcional de la obra..."
        ></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Cliente -->
        <div>
          <label class="label-form">Cliente</label>
          <input
            pInputText
            formControlName="cliente"
            placeholder="Nombre del cliente"
            class="w-full"
          />
        </div>

        <!-- Dirección -->
        <div>
          <label class="label-form">Dirección</label>
          <input
            pInputText
            formControlName="direccion"
            placeholder="Dirección o ubicación"
            class="w-full"
          />
        </div>

        <!-- Fecha inicio -->
        <div>
          <label class="label-form">Fecha Inicio *</label>
          <p-datepicker
            formControlName="fechaInicio"
            appendTo="body"
            dateFormat="dd/mm/yy"
            styleClass="w-full"
            inputStyleClass="w-full"
            class="w-full block"
            [showIcon]="true"
            placeholder="Selecciona fecha"
          />
          @if (invalid("fechaInicio")) {
            <p class="error-msg">Fecha de inicio obligatoria</p>
          }
        </div>

        <!-- Fecha fin prevista -->
        <div>
          <label class="label-form">Fecha Fin Prevista</label>
          <p-datepicker
            formControlName="fechaFinPrevista"
            appendTo="body"
            dateFormat="dd/mm/yy"
            styleClass="w-full"
            inputStyleClass="w-full"
            class="w-full block"
            [showIcon]="true"
            placeholder="Selecciona fecha"
          />
        </div>

        <!-- Presupuesto Estimado -->
        <div>
          <label class="label-form">Presupuesto Estimado (€) *</label>
          <p-inputNumber
            formControlName="presupuestoEstimado"
            mode="currency"
            currency="EUR"
            locale="es-ES"
            styleClass="w-full"
            inputStyleClass="w-full"
            class="w-full block"
            placeholder="0,00 €"
          />
          @if (invalid("presupuestoEstimado")) {
            <p class="error-msg">Presupuesto inválido</p>
          }
        </div>

        <!-- Estado -->
        <div>
          <label class="label-form">Estado *</label>
          <p-select
            formControlName="estado"
            [options]="estadoOptions"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="w-full"
            placeholder="Selecciona estado"
          />
        </div>
      </div>
    </form>
  }

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2 w-full pt-2">
      <p-button
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        (onClick)="visible.set(false); onHide()"
        [disabled]="saving()"
      />
      <p-button
        [label]="obraId() ? 'Guardar cambios' : 'Crear Obra'"
        icon="pi pi-check"
        (onClick)="submit()"
        [loading]="saving()"
        [disabled]="form.invalid || loadingData()"
      />
    </div>
  </ng-template>
</p-dialog>
